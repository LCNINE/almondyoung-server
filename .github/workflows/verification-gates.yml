name: Verification gates

# type-check 와 jest 를 PR 게이트로 고정한다.
#
# 이 워크플로가 없던 동안 spec 타입 에러 159건 · jest 실패 22 suite 가 아무 저항
# 없이 쌓였다 (2026-08-13 조사). 빌드가 초록이었던 건 nest build 가
# tsconfig.build.json 으로 **spec 을 제외**하기 때문이고, jest 는
# tsconfig.jest.json 의 isolatedModules 때문에 transpile-only 라 타입을 아예 안 본다.
# 즉 spec 의 타입을 지키는 건 type-check 뿐이다.
#
# 초록을 되찾은 뒤 다시 썩지 않게 하는 게 목적이므로 flagging 이 아니라 *차단*이다.
#
# 소비 스키마 검증 게이트도 여기 붙는다. 이건 타입도 테스트도 못 잡는 종류다 —
# `validateOnConsume` 을 켠 앱들이 안전한 근거는 "발행이 전부 zod 파싱을 지난다"는
# 정적 증명이고, 그 증명은 발행 경로가 지금 모양일 때만 성립한다. 새 `transport.send`
# 호출이 하나 생기면 증명이 조용히 무너지므로 사람이 기억해서 돌리는 대신 여기서 센다 (#611).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]

concurrency:
  group: verification-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      # 루트 jest 는 `apps/admin-web/src/**/*.spec.ts` 를 **포함**하는데 루트 `npm ci` 는
      # admin-web 의존성을 깔지 않는다. 그래서 admin-web 전용 패키지를 참조하는 spec 이
      # 하나 생기면 CI 에서만 `Cannot find module` 로 죽는다 — 로컬은 `apps/admin-web/node_modules`
      # 가 있어 통과하므로 **로컬 게이트가 구조적으로 못 잡는다.**
      #
      # 같은 부류가 세 번 터졌다: #701(한 건만 고침) → 09-03 `@tanstack`(#783) →
      # 09-09 `sonner`(#743 B). 매번 인스턴스만 고쳐서 재발했으므로 여기서 부류를 막는다.
      # 이 한 줄이면 CI 의 모듈 해석 조건이 로컬과 같아진다.
      - name: Install admin-web deps
        run: npm ci --prefix apps/admin-web

      # spec 을 포함한 전 범위 타입 검사. 기준선은 에러 0 이다.
      - name: Type check
        run: npm run type-check

      # DB 를 요구하는 통합 스펙은 describeIfDb / REQUIRE_*_DB 가드로 자동 skip 된다.
      - name: Unit tests
        run: npx jest --ci --silent

      # 발행 경로가 소비 검증의 전제를 깨지 않는지 AST 로 센다. 둘 중 하나면 exit 1 —
      # transport.send 호출 지점이 SEND_PATHS 와 어긋나거나, 검증을 켠 앱에
      # 계약 미검증(UNVERIFIED) 이벤트가 생긴 경우. DB·네트워크·env 를 쓰지 않는다.
      - name: Consume validation gate
        run: npm run audit:consume-validation -- --gate
