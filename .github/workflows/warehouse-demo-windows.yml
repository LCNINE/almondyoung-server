name: Warehouse Demo Windows

on:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [demo, live]
        default: demo
  push:
    branches: ['codex/**']
    paths:
      - 'native/warehouse-app/**'
      - '.github/workflows/warehouse-demo-windows.yml'
  pull_request:
    paths:
      - 'native/warehouse-app/**'
      - '.github/workflows/warehouse-demo-windows.yml'

permissions:
  contents: read

concurrency:
  group: warehouse-demo-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native/warehouse-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/warehouse-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/warehouse-app/src-tauri -> target
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Enable Yarn for the existing demo build commands
        run: corepack enable
      - name: Test Windows demo configuration and input boundaries
        run: npx vitest run src/app/demo-config.test.ts src/core/hardware/scan
      # 자동 업데이트는 버전이 올라가야 새 버전으로 본다 — 실행 번호를 패치 자리에 쓴다
      - name: Stamp version
        shell: pwsh
        run: '"{""version"": ""0.1.${{ github.run_number }}""}" | Out-File -Encoding ascii src-tauri/tauri.version.conf.json'
      - name: Build ${{ inputs.stage || 'demo' }} installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: corepack yarn tauri:build:${{ inputs.stage || 'demo' }} --bundles nsis --config src-tauri/tauri.version.conf.json
      - name: Record installer checksums
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($_.Name)" | Out-File -Append -Encoding utf8 src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: warehouse-${{ inputs.stage || 'demo' }}-windows-${{ github.sha }}
          path: native/warehouse-app/src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
          retention-days: 30
